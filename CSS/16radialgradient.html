<!DOCTYPE html>
<html>
<head>
    <title>Radial Gradient</title>
    <link rel="stylesheet" href="16.css">
</head>
<body>

    <h1>CSS Radial Gradient</h1>

    <h2>1. Default Radial Gradient</h2>
    <div class="box default"></div>

    <h2>2. Circle Shape</h2>
    <div class="box circle"></div>

    <h2>3. Closest Side</h2>
    <div class="box closest-side"></div>

    <h2>4. Farthest Side</h2>
    <div class="box farthest-side"></div>

    <h2>5. Closest Corner</h2>
    <div class="box closest-corner"></div>

    <h2>6. Farthest Corner</h2>
    <div class="box farthest-corner"></div>

    <h2>7. Position</h2>
    <div class="box position"></div>

    <h2>8. Color Stops</h2>
    <div class="box color-stops"></div>

    <h2>9. Repeating Radial Gradient</h2>
    <div class="box repeating"></div>

</body>
</html>
