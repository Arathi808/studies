<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed and Object</title>
</head>

<body>

    <h2>Embed Tag</h2>

    <embed src="8.work.html" type="text/html" width="500" height="300">


    <h2>Object Tag</h2>

    <object data="vdo.mp4" type="video/mp4" width="500" height="300">

        <p>Sorry, your browser cannot display this video.</p>

    </object>

</body>

</html>
