<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <table>
        <tr>
            <tr>
                <td><label for="firstname">First Name</label></td>
                <td><input type="text" name="firstname" id="firstname" placeholder="Enter your first name" required> (max 30 characters a-z and A-Z)</td>
                
            </tr>
            <tr>
                <td><label for="lastname">Last Name</label></td>

                <td><input type="text" name="lastname" id="lastname" placeholder="Enter your last name" required>(max 30 characters a-z and A-Z)</td>
                
            </tr>
            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td><input type="date" name="dob" id="dob" required></td>
            </tr>
            <tr>
                <td><label for="email">Email ID</label></td>
                <td><input type="email" name="email" id="email" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone Number</label></td>
                <td><input type="number" name="phone" id="phone" required>(10 digit number)</td>
                
            </tr>
            <tr>
                <td><label for="gender">Gender</label></td>
                <td>
                    <input type="radio" name="gender" id="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="female">
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><textarea name="address" id="address" required></textarea></td>
            </tr>
            <tr>
                <td><label for="city">City</label></td>
                <td><input type="text" name="city" id="city" required>(max 30 characters a-z and A-Z)</td>
                 
            </tr>
            <tr>
                <td><label for="pincode">Pin Code</label></td>
                <td><input type="number" name="pincode" id="pincode" required>(6 digit number)</td>
                
            </tr>
            <tr>
                <td><label for="state">State</label></td>
                <td><input type="text" name="state" id="state" required>(max 30 characters a-z and A-Z)</td>

            </tr>
            <tr>
                <td><label for="country">Country</label></td>
                <td><input type="text" name="country" id="country" required></td>
               
            </tr>
            <tr>
                <td><label for="Hobbies">Hobbies</label></td>
                <td>
                    <label for="drawing">Drawing</label>
                     <input type="checkbox" name="drawing" id="drawing">
                     <label for="singing">Singing</label>
                     <input type="checkbox" name="singing" id="singing">
                     <label for="dancing">Dancing</label>
                     <input type="checkbox" name="dancing" id="dancing">
                     <label for="sketching">Sketching</label>
                     <input type="checkbox" name="sketching" id="sketching">
                     <label for="others">Others</label>
                     <input type="checkbox" name="others" id="others">
                     <input type="text" name="otherhobby" id="otherhobby" placeholder="Enter your hobby">
                </td>
            </tr>
            <tr>
                <td><label>Qualification</label></td>
                <td>
                    <table>
                        <thead>
                            <tr>
                                <th>Sl.No.</th>
                                <th>Examination</th>
                                <th>Board</th>
                                <th>Percentage</th>
                                <th>Year of Passing</th>
                            </tr>
                        </thead>
                        <tbody
                            <tr>
                                <td> 1 </td>
                                <td>Class X</td>
                                <td><input type="text" name="board1" id="board1" maxlength="10"></td>
                                <td><input type="number" name="percentage1" id="percentage1"></td>
                                <td><input type="number" name="percentage1" id="percentage1"></td>
                            </tr>
                            <tr>
                                <td> 2 </td>
                                <td>Class XII</td>
                                <td><input type="text" name="board2" id="board2"></td>
                                <td><input type="number" name="percentage2" id="percentage2"></td>
                                <td><input type="number" name="year2" id="year2"></td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Graduation</td>
                                <td><input type="text" name="board3" id="board3"></td>
                                <td><input type="number" name="percentage3" id="percentage3"></td>
                                <td><input type="number" name="year3" id="year3"></td>
                            </tr>
                            <tr>
                                <td>4</td>
                                <td>Masters</td>
                                <td><input type="text" name="board4" id="board4"></td>
                                <td><input type="number" name="percentage4" id="percentage4"></td>
                                <td><input type="number" name="year4" id="year4"></td>
                
                            </tr>
                            <tr>
                                <td></td>
                                <td></td>
                                <td align="center">(10 char max)</td>
                                <td align="center">(upto 2 decimal places)</td>
                                <td></td>
                           </tr>
                       </tbody>
                   </table>
               </td>
            </tr>
            <tr>

               <td><label for="courses">Courses Applied For</label></td>
               <td>
               <label for="course1">BCA</label>
               <input type="radio" name="course1" id="course1">
               <label for="course2">B.Com</label>
               <input type="radio" name="course2" id="course2">
               <label for="course3">B.A</label>
               <input type="radio" name="course3" id="course3">
               </td>
           </tr>
                <td colspan="2" align="center">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">

                </td>
            </tr>
        </table>
    </form>
</body>
</html>
