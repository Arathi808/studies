<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td><label for="username">Username</label> </td>
                <td><input type="text" id="username" name="Username"
                placeholder="Username" required></td>
            </tr>
            <tr>
                <td><label for="password">Password</label> </td>
                <td><input type="password" id="password" name="Password"
                placeholder="Password" required></td>
        
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" name="Email" id="email" placeholder="Email" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone number</label></td>
                <td><input type="tel" name="phone" id="phone" placeholder="Phone Number" maxlength="10"></td>
            </tr>
            <tr>
                <td><label for="age">Age</label></td>
                <td><input type="number" name="age" id="age" placeholder="Age"></td>

            </tr>
            <tr>
                <td><label for="gender">Gender</label></td>
                <td>
                    <input type="radio" name="gender" id="male">
                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="female">
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td><label for="qualifications">Qualifications</label></td>
                <td>
                    <input type="checkbox" name="sslc" id="sslc">
                    <label for="sslc">SSLC</label>
                    <input type="checkbox" name="+2" id="+2">
                    <label for="+2">+2</label>
                    <input type="checkbox" checked name="degree" id="degree">
                    <label for="degree">Degree</label>
                </td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td><input type="date" name="dob" id="dob" min="2004-01-01" max="2024-12-31"></td>
            </tr>
            <tr>
                <td><label for="time">Time</label></td>
                <td><input type="time" name="time" id="time"></td>
            </tr>
            <tr>
                <td><label for="file">File</label></td>
                <td><input type="file" name="file" id="file" accept=".png,.jpg,.jpeg"></td>
            </tr>

            <tr>
                <td><input type="submit" style="width:100%;"></td>
                <td><input type="reset" value="clear" style="width: 100%;"></td>

    
            </tr>
        </table>
    </form>

        
    </body>

</html>
